<!-- ==============================
     TOP HEADER
================================ -->

<header
    class="h-[72px]
           border-b border-slate-200
           flex items-center
           justify-end
           px-4
           sm:px-6
           lg:px-8"
>

    <div
        class="flex items-center gap-3"
    >

        <!-- Profile Image -->

        <div
            class="w-10 h-10
                   rounded-full
                   bg-blue-500
                   flex items-center
                   justify-center
                   text-white
                   shrink-0
                   border-2
                   overflow-hidden"
        >

            {% if profile.profile_picture %}

                <img
                    src="{{ profile.profile_picture.url }}"
                    alt="Profile"
                    class="w-full h-full object-cover"
                >

            {% else %}

                <svg
                    class="w-6 h-6"
                    fill="none"
                    stroke="currentColor"
                    stroke-width="2"
                    viewBox="0 0 24 24"
                >

                    <circle
                        cx="12"
                        cy="8"
                        r="4"
                    />

                    <path
                        d="M4 21c0-4 3.5-7 8-7s8 3 8 7"
                    />

                </svg>

            {% endif %}

        </div>


        <!-- User Name -->

        <span
            class="font-semibold
                   text-slate-800
                   hidden
                   sm:block"
        >
            {{ request.user.first_name|default:request.user.username }}
        </span>

    </div>

</header>
